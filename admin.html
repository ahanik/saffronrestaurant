<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Saffron</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      --card-bg: rgba(30, 41, 59, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --primary: #f59e0b;
      --primary-hover: #d97706;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --danger: #ef4444;
      --success: #10b981;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', 'Hind Siliguri', sans-serif; }
    
    body { 
      background: var(--bg-gradient); 
      color: var(--text-main); 
      padding: 30px 15px; 
      min-height: 100vh;
    }

    .container { max-width: 900px; margin: 0 auto; }
    .header-title { text-align: center; margin-bottom: 30px; }
    .header-title h1 {
      font-size: 2.5rem;
      background: linear-gradient(to right, #fbbf24, #f59e0b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }
    .header-title p { color: var(--text-muted); font-size: 0.95rem; }

    .section { 
      background: var(--card-bg); 
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      padding: 24px; 
      border-radius: 16px; 
      margin-bottom: 24px; 
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    .section h3 { 
      font-size: 1.25rem;
      margin-bottom: 20px; 
      color: #fbbf24; 
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      padding-bottom: 12px;
    }

    .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; }
    .form-group { margin-bottom: 16px; }

    label { display: block; margin-bottom: 6px; font-weight: 500; font-size: 0.88rem; color: var(--text-muted); }

    input[type="text"], input[type="number"], textarea, select { 
      width: 100%; 
      padding: 12px 14px; 
      border-radius: 8px; 
      border: 1px solid rgba(255, 255, 255, 0.1); 
      background: rgba(15, 23, 42, 0.6); 
      color: #fff; 
      outline: none; 
      font-size: 0.95rem;
    }

    input[type="file"] { 
      width: 100%; 
      padding: 10px; 
      background: rgba(15, 23, 42, 0.6); 
      border-radius: 8px; 
      border: 1px dashed rgba(255, 255, 255, 0.2); 
      color: var(--text-muted); 
      cursor: pointer;
    }

    .file-hint { font-size: 0.75rem; color: #f59e0b; margin-top: 4px; display: block; }

    .btn { 
      background: linear-gradient(135deg, var(--primary), var(--primary-hover)); 
      color: #0f172a; 
      font-weight: 700; 
      border: none; 
      padding: 12px 20px; 
      border-radius: 8px; 
      cursor: pointer; 
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-add { background: linear-gradient(135deg, #10b981, #059669); color: #fff; margin-top: 10px; width: 100%; }
    .btn-delete { background: rgba(239, 68, 68, 0.15); color: var(--danger); padding: 8px 12px; border-radius: 6px; border: 1px solid rgba(239, 68, 68, 0.3); cursor: pointer; }
    .btn-delete:hover { background: var(--danger); color: #fff; }

    .dynamic-list-item { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      background: rgba(15, 23, 42, 0.5); 
      padding: 12px 16px; 
      border-radius: 8px; 
      margin-bottom: 10px; 
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    #statusMessage { margin-top: 20px; font-weight: 600; text-align: center; font-size: 1rem; padding: 12px; border-radius: 8px; }
    .save-container { position: sticky; bottom: 20px; z-index: 100; }
    .btn-save-all { width: 100%; padding: 16px; font-size: 1.1rem; background: linear-gradient(135deg, #6366f1, #4f46e5); color: #fff; box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.5); }
  </style>
</head>
<body>

  <div class="container">
    <div class="header-title">
      <h1>Saffron Control Center</h1>
      <p>রেস্তোরাঁ ও কন্টেন্ট ম্যানেজমেন্ট প্যানেল</p>
    </div>

    <!-- Basic Info -->
    <div class="section">
      <h3><i class="fa-solid fa-store"></i> Basic Info & Branding</h3>
      <div class="grid-2">
        <div class="form-group"><label>Restaurant Name</label><input type="text" id="restaurantName"></div>
        <div class="form-group"><label>Tagline</label><input type="text" id="tagline"></div>
      </div>
      <div class="form-group"><label>Operating Hours</label><input type="text" id="operatingHours"></div>
      
      <div class="grid-2">
        <div class="form-group">
          <label>Logo Image</label>
          <input type="file" id="logoFile" accept="image/*">
          <span class="file-hint">Max size: 1 MB</span>
        </div>
        <div class="form-group">
          <label>Cover Image</label>
          <input type="file" id="coverFile" accept="image/*">
          <span class="file-hint">Max size: 1 MB</span>
        </div>
      </div>
    </div>

    <!-- Contact & Social -->
    <div class="section">
      <h3><i class="fa-solid fa-share-nodes"></i> Contact & Social Links</h3>
      <div class="grid-2">
        <div class="form-group"><label>Phone</label><input type="text" id="phone"></div>
        <div class="form-group"><label>WhatsApp</label><input type="text" id="whatsapp"></div>
        <div class="form-group"><label>Email</label><input type="text" id="email"></div>
        <div class="form-group"><label>Address</label><input type="text" id="address"></div>
      </div>
      <div class="grid-2">
        <div class="form-group"><label>Google Maps URL</label><input type="text" id="googleMapsUrl"></div>
        <div class="form-group"><label>Instagram URL</label><input type="text" id="instagram"></div>
        <div class="form-group"><label>YouTube URL</label><input type="text" id="youtube"></div>
        <div class="form-group"><label>TikTok URL</label><input type="text" id="tiktok"></div>
      </div>
    </div>

    <!-- Menu Cards Section (একের অধিক ছবি আপলোডের সুবিধা) -->
    <div class="section">
      <h3><i class="fa-solid fa-book-open"></i> Menu Card Pages</h3>
      <div class="form-group">
        <label>Add Menu Card Image</label>
        <input type="file" id="menuCardFileInput" accept="image/*">
        <span class="file-hint">Max size: 1 MB</span>
        <button type="button" class="btn btn-add" onclick="addMenuCardImg()"><i class="fa-solid fa-plus"></i> Add Menu Card Page</button>
      </div>
      <div id="menuCardsListAdmin"></div>
    </div>

    <!-- Categories -->
    <div class="section">
      <h3><i class="fa-solid fa-list"></i> Menu Categories</h3>
      <div class="form-group">
        <input type="text" id="newCategoryInput" placeholder="New Category Name">
        <button type="button" class="btn btn-add" onclick="addCategory()"><i class="fa-solid fa-plus"></i> Add Category</button>
      </div>
      <div id="categoriesList"></div>
    </div>

    <!-- Food Items -->
    <div class="section">
      <h3><i class="fa-solid fa-utensils"></i> Food Items</h3>
      <div class="grid-2">
        <div class="form-group"><label>Food Name</label><input type="text" id="foodName"></div>
        <div class="form-group">
          <label>Category</label>
          <select id="foodCategorySelect"></select>
        </div>
      </div>
      <div class="form-group"><label>Price (৳)</label><input type="number" id="foodPrice"></div>
      <div class="form-group"><label>Description</label><textarea id="foodDesc" rows="2"></textarea></div>
      <div class="form-group">
        <label>Food Image</label>
        <input type="file" id="foodImgFile" accept="image/*">
        <span class="file-hint">Max size: 1 MB</span>
      </div>
      <button type="button" class="btn btn-add" onclick="addFoodItem()"><i class="fa-solid fa-plus"></i> Add Food Item</button>
      <br><br>
      <div id="foodItemsListAdmin"></div>
    </div>

    <!-- Offers -->
    <div class="section">
      <h3><i class="fa-solid fa-tags"></i> Special Offers</h3>
      <div class="form-group"><label>Offer Title</label><input type="text" id="offerTitleInput"></div>
      <div class="form-group"><label>Offer Description</label><textarea id="offerDescInput" rows="2"></textarea></div>
      <div class="form-group">
        <label>Offer Banner Image</label>
        <input type="file" id="offerImgFile" accept="image/*">
        <span class="file-hint">Max size: 1 MB</span>
      </div>
      <button type="button" class="btn btn-add" onclick="addOffer()"><i class="fa-solid fa-plus"></i> Add Offer</button>
      <br><br>
      <div id="offersListAdmin"></div>
    </div>

    <!-- Gallery -->
    <div class="section">
      <h3><i class="fa-solid fa-images"></i> Gallery Images</h3>
      <div class="form-group">
        <input type="file" id="galImgFileInput" accept="image/*">
        <span class="file-hint">Max size: 1 MB</span>
        <button type="button" class="btn btn-add" onclick="addGalleryImg()"><i class="fa-solid fa-plus"></i> Add Gallery Image</button>
      </div>
      <div id="galleryListAdmin"></div>
    </div>

    <!-- Save Button -->
    <div class="save-container">
      <button type="button" class="btn btn-save-all" id="saveBtn"><i class="fa-solid fa-floppy-disk"></i> Save All Changes</button>
    </div>
    <div id="statusMessage"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
    import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBMtcz26R_DnJEKGKv13TevABLu7Z6y-C4",
      authDomain: "saffronclient.firebaseapp.com",
      projectId: "saffronclient",
      storageBucket: "saffronclient.firebasestorage.app",
      messagingSenderId: "71723897421",
      appId: "1:71723897421:web:6998284b9d48a02096c204",
      measurementId: "G-3FH2128FN2"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const MAX_FILE_SIZE_MB = 1;

    let categories = ["Main Course", "Fast Food", "Drinks"];
    let foodItems = [];
    let offersList = [];
    let galleryList = [];
    let menuCardUrls = [];

    const isFileValid = (file) => {
      if (!file) return false;
      const sizeMB = file.size / (1024 * 1024);
      if (sizeMB > MAX_FILE_SIZE_MB) {
        alert(`File size exceeds ${MAX_FILE_SIZE_MB}MB limit!`);
        return false;
      }
      return true;
    };

    const compressImage = (file, maxWidth = 500, quality = 0.3) => {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = event => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;

            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.onerror = error => reject(error);
        };
        reader.onerror = error => reject(error);
      });
    };

    /* Menu Cards */
    window.addMenuCardImg = async function() {
      const fileInput = document.getElementById("menuCardFileInput");
      const file = fileInput.files[0];
      if(!file || !isFileValid(file)) return;

      const img = await compressImage(file, 600, 0.4);
      menuCardUrls.push(img);
      fileInput.value = "";
      renderMenuCardsUI();
    }

    window.deleteMenuCardImg = idx => { menuCardUrls.splice(idx, 1); renderMenuCardsUI(); }

    function renderMenuCardsUI() {
      const list = document.getElementById("menuCardsListAdmin");
      list.innerHTML = "";
      menuCardUrls.forEach((m, idx) => {
        list.innerHTML += `
          <div class="dynamic-list-item">
            <span>Menu Card Page #${idx + 1}</span>
            <button type="button" class="btn-delete" onclick="deleteMenuCardImg(${idx})"><i class="fa-solid fa-trash"></i></button>
          </div>
        `;
      });
    }

    /* Categories */
    window.addCategory = function() {
      const val = document.getElementById("newCategoryInput").value.trim();
      if(val && !categories.includes(val)) {
        categories.push(val);
        document.getElementById("newCategoryInput").value = "";
        renderCategoryUI();
      }
    }

    window.deleteCategory = index => { categories.splice(index, 1); renderCategoryUI(); }

    function renderCategoryUI() {
      const container = document.getElementById("categoriesList");
      const select = document.getElementById("foodCategorySelect");
      container.innerHTML = ""; select.innerHTML = "";

      categories.forEach((cat, idx) => {
        container.innerHTML += `
          <div class="dynamic-list-item">
            <span>${cat}</span>
            <button type="button" class="btn-delete" onclick="deleteCategory(${idx})"><i class="fa-solid fa-trash"></i></button>
          </div>
        `;
        select.innerHTML += `<option value="${cat}">${cat}</option>`;
      });
    }

    /* Food Items */
    window.addFoodItem = async function() {
      const name = document.getElementById("foodName").value.trim();
      const cat = document.getElementById("foodCategorySelect").value;
      const price = document.getElementById("foodPrice").value;
      const desc = document.getElementById("foodDesc").value;
      const file = document.getElementById("foodImgFile").files[0];

      if(!name || !price) { alert("Please enter food name and price"); return; }

      let img = "https://via.placeholder.com/100";
      if(file) {
        if(!isFileValid(file)) return;
        img = await compressImage(file, 350, 0.3);
      }

      foodItems.push({ name, category: cat, price, description: desc, imageUrl: img });
      document.getElementById("foodName").value = "";
      document.getElementById("foodPrice").value = "";
      document.getElementById("foodDesc").value = "";
      document.getElementById("foodImgFile").value = "";
      renderFoodItemsUI();
    }

    window.deleteFoodItem = idx => { foodItems.splice(idx, 1); renderFoodItemsUI(); }

    function renderFoodItemsUI() {
      const list = document.getElementById("foodItemsListAdmin");
      list.innerHTML = "";
      foodItems.forEach((f, idx) => {
        list.innerHTML += `
          <div class="dynamic-list-item">
            <div><strong>${f.name}</strong> (৳${f.price}) - <em>${f.category}</em></div>
            <button type="button" class="btn-delete" onclick="deleteFoodItem(${idx})"><i class="fa-solid fa-trash"></i></button>
          </div>
        `;
      });
    }

    /* Offers */
    window.addOffer = async function() {
      const title = document.getElementById("offerTitleInput").value.trim();
      const desc = document.getElementById("offerDescInput").value.trim();
      const file = document.getElementById("offerImgFile").files[0];

      if(!title || !file || !isFileValid(file)) return;

      const img = await compressImage(file, 500, 0.4);
      offersList.push({ title, desc, imageUrl: img });
      document.getElementById("offerTitleInput").value = "";
      document.getElementById("offerDescInput").value = "";
      document.getElementById("offerImgFile").value = "";
      renderOffersUI();
    }

    window.deleteOffer = idx => { offersList.splice(idx, 1); renderOffersUI(); }

    function renderOffersUI() {
      const list = document.getElementById("offersListAdmin");
      list.innerHTML = "";
      offersList.forEach((o, idx) => {
        list.innerHTML += `
          <div class="dynamic-list-item">
            <span>${o.title}</span>
            <button type="button" class="btn-delete" onclick="deleteOffer(${idx})"><i class="fa-solid fa-trash"></i></button>
          </div>
        `;
      });
    }

    /* Gallery */
    window.addGalleryImg = async function() {
      const fileInput = document.getElementById("galImgFileInput");
      const file = fileInput.files[0];
      if(!file || !isFileValid(file)) return;

      const img = await compressImage(file, 500, 0.4);
      galleryList.push(img);
      fileInput.value = "";
      renderGalleryUI();
    }

    window.deleteGalleryImg = idx => { galleryList.splice(idx, 1); renderGalleryUI(); }

    function renderGalleryUI() {
      const list = document.getElementById("galleryListAdmin");
      list.innerHTML = "";
      galleryList.forEach((g, idx) => {
        list.innerHTML += `
          <div class="dynamic-list-item">
            <span>Gallery Image #${idx + 1}</span>
            <button type="button" class="btn-delete" onclick="deleteGalleryImg(${idx})"><i class="fa-solid fa-trash"></i></button>
          </div>
        `;
      });
    }

    /* Load Data */
    async function loadExistingData() {
      try {
        const docSnap = await getDoc(doc(db, "restaurants", "mainData"));
        if (docSnap.exists()) {
          const d = docSnap.data();
          document.getElementById("restaurantName").value = d.restaurantName || "";
          document.getElementById("tagline").value = d.tagline || "";
          document.getElementById("operatingHours").value = d.operatingHours || "";
          document.getElementById("phone").value = d.phone || "";
          document.getElementById("whatsapp").value = d.whatsapp || "";
          document.getElementById("email").value = d.email || "";
          document.getElementById("address").value = d.address || "";
          document.getElementById("googleMapsUrl").value = d.googleMapsUrl || "";
          document.getElementById("instagram").value = d.instagram || "";
          document.getElementById("youtube").value = d.youtube || "";
          document.getElementById("tiktok").value = d.tiktok || "";

          if(d.categories) categories = d.categories;
          if(d.foodItems) foodItems = d.foodItems;
          if(d.offersList) offersList = d.offersList;

          renderCategoryUI();
          renderFoodItemsUI();
          renderOffersUI();
        }

        // Fetch Menu Cards
        const menuSnap = await getDoc(doc(db, "restaurants", "menuCards"));
        if (menuSnap.exists()) {
          menuCardUrls = menuSnap.data().menuCardUrls || [];
          renderMenuCardsUI();
        }

        // Fetch Gallery
        const gallerySnap = await getDoc(doc(db, "restaurants", "gallery"));
        if (gallerySnap.exists()) {
          galleryList = gallerySnap.data().galleryList || [];
          renderGalleryUI();
        }

      } catch (e) { console.error(e); }
    }
    loadExistingData();

    /* Save Data */
    document.getElementById("saveBtn").addEventListener("click", async () => {
      const statusMsg = document.getElementById("statusMessage");
      statusMsg.style.background = "rgba(245, 158, 11, 0.2)";
      statusMsg.style.color = "#f59e0b";
      statusMsg.innerText = "Processing & saving data...";

      try {
        const getFile = id => document.getElementById(id).files[0];
        const logoFile = getFile("logoFile");
        const coverFile = getFile("coverFile");

        if(logoFile && !isFileValid(logoFile)) return;
        if(coverFile && !isFileValid(coverFile)) return;

        const infoData = {
          restaurantName: document.getElementById("restaurantName").value,
          tagline: document.getElementById("tagline").value,
          operatingHours: document.getElementById("operatingHours").value,
          phone: document.getElementById("phone").value,
          whatsapp: document.getElementById("whatsapp").value,
          email: document.getElementById("email").value,
          address: document.getElementById("address").value,
          googleMapsUrl: document.getElementById("googleMapsUrl").value,
          instagram: document.getElementById("instagram").value,
          youtube: document.getElementById("youtube").value,
          tiktok: document.getElementById("tiktok").value,
          categories: categories,
          foodItems: foodItems,
          offersList: offersList
        };

        if (logoFile) infoData.logoUrl = await compressImage(logoFile, 250, 0.4);
        if (coverFile) infoData.coverUrl = await compressImage(coverFile, 600, 0.3);

        // Save in separated documents to bypass 1MB limit
        await setDoc(doc(db, "restaurants", "mainData"), infoData, { merge: true });
        await setDoc(doc(db, "restaurants", "menuCards"), { menuCardUrls: menuCardUrls });
        await setDoc(doc(db, "restaurants", "gallery"), { galleryList: galleryList });

        statusMsg.style.background = "rgba(16, 185, 129, 0.2)";
        statusMsg.style.color = "#10b981";
        statusMsg.innerText = "✓ Saved Successfully!";
      } catch (e) {
        console.error(e);
        statusMsg.style.background = "rgba(239, 68, 68, 0.2)";
        statusMsg.style.color = "#ef4444";
        statusMsg.innerText = "Failed to save data. Please try again.";
      }
    });
  </script>
</body>
</html>
